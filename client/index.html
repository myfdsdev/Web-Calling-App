<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ringweb.png" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#000000" />

    <!-- ── Core SEO ─────────────────────────────────────────────────────── -->
    <title>ringwebai</title>
    <meta
      name="description"
      content="Build web voice agents in minutes. Create an agent through a guided chat, share a link, and let customers call or message it — every conversation becomes a lead."
    />
    <meta
      name="keywords"
      content="web voice agent, voice AI, Vapi, virtual receptionist, AI phone agent, lead capture, conversational AI"
    />
    <meta name="author" content="ringwebai" />
    <meta name="application-name" content="ringwebai" />
    <meta name="robots" content="index, follow" />
    <meta name="format-detection" content="telephone=no" />

    <!-- ── Open Graph (WhatsApp, Facebook, LinkedIn) ────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vox" />
    <meta property="og:title" content="ringwebai — ringwebai" />
    <meta
      property="og:description"
      content="Build AI voice agents in minutes. Share a link and let customers call or message your agent — every conversation becomes a lead."
    />
    <!-- TODO: drop a 1200×630 PNG at client/public/og-image.png for rich link previews. -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- ── Twitter / X ──────────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vox — Voice Agent Studio" />
    <meta
      name="twitter:description"
      content="Build web voice agents in minutes. Share a link and let customers call or message your agent."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Public agent page only: Kalam for the agent name, Prompt for body/buttons.
         Trimmed to the weights actually used so the extra request stays small. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Prompt:wght@200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
